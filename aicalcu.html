<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
      * {
           box-sizing: border-box;
      }
      
      body {
           margin: 0;
           min-height: 100vh;
           display: flex;
           justify-content: center;            align-items: center;
           padding: 20px;
           font-family: Arial, sans-serif;
           background: linear-gradient(135deg, #3b3b3b, #000000);
       }
      .calculator {
           width: 100%;
           max-width: 420px;
           padding: 28px;
           background: hwb(0 86% 14%);            border-radius: 20px;
           box-shadow: 0 12px 35px rgba(30, 41, 59, 0.15);
        }

        h1 {
           margin-top: 0;
           margin-bottom: 24px;
           text-align: center;
           color: #1e293b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #7e7e7e;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #e39b00;
            border-color: #f6ca3b;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 13px 10px;
            border: none;
            border-radius: 10px;
            background: #ec943c;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d1b026;
        }

        #output {
            margin-bottom: 0;
            margin-top: 22px;
            padding: 16px;
            border-radius: 10px;
            border: 2px solid gray;
            background: #f7f5e0;
            color: #000000;
            text-align: center;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main class="calculator">
  <h1>My Calculator</h1>

    <label for="num1">Enter 1st Number:</label>
    <input type="number" id="num1" step="any" placeholder="e.g. 12">

    <label for="num2">Enter 2nd Number:</label>
    <input type="number" id="num2" step="any" placeholder="e.g. 4">

    <div class="buttons"> 
    <button onclick="calculate('add')">Add (+)</button>
    <button onclick="calculate('subtract')">Subtract (-)</button>
    <button onclick="calculate('multiply')">Multiply (×)</button>
    <button onclick="calculate('divide')">Divide (÷)</button>
    </div>

    <h2 id="output">Result: 0</h2>

    <script>
        function calculate(operation) {
            let input1 = document.getElementById("num1").value;
            let input2 = document.getElementById("num2").value;

            if (input1 === "" || input2 === "") {
                document.getElementById("output").textContent =
                    "Please enter both numbers.";
                return;
            }

            let num1 = Number(input1);
            let num2 = Number(input2);
            let total;

            if (operation === "add") {
                total = num1 + num2;
            } else if (operation === "subtract") {
                total = num1 - num2;
            } else if (operation === "multiply") {
                total = num1 * num2;
            } else if (operation === "divide") {
                if (num2 === 0) {
                    document.getElementById("output").textContent =
                        "You cannot divide by zero.";
                    return;
                }
                total = num1 / num2;
            }

            document.getElementById("output").textContent =
                "Result: " + total;
        }
    </script>
    </main>
</body>
</html>
